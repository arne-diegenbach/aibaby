role = "auditory"
neurons = 192               # 8 neurons per mel channel
n_max = 1024
# Every auditory neuron now branches into the vocal module as well as into
# central, which costs it ~19 more synapses. At 48 the busiest neurons in some
# developmental seeds ran out of slots and their synapses were silently
# discarded — the genome and the built brain stop agreeing, and only the
# startup banner says so.
