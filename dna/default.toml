# aibaby genome — v16 format, DNA v6 feedforward wiring plus top-down feedback.
#
# The blob layout is v15 — projections carry a `kind` and the receptive-field
# parameters the two structured wiring rules read. This genome uses neither:
# the V1 and V2 stages were built, measured and reverted (README, "DNA v7").
# The visual *wiring* below is unchanged from the one every G2, M2 and G3 number
# up to DNA v11 was measured on — but the creature is not, because v12 switches
# divisive normalisation on for `central` (v12) and, since v14, top-down
# feedback from central onto the two distance senses. v15 adds predictive coding
# and ships it off, so the creature is bit-identical to v14. Hash history:
# 7b2e385d6ef2faf5 (v9-v11), 0ebf3dad6155254b (v12-v13), 2594458a1939c28e (v14),
# unchanged at v15. Any number quoted against an earlier hash is stale.
# (At `--experiment determinism`'s default 120k ticks the same creature hashes
# be2e508dfc170240 — the two lengths are not comparable to each other.)
#
# Everything here is heritable: it defines the brain at birth and the rules by
# which it may change. Nothing in this file is a runtime tuning knob. Every
# field is required — there are no defaults, because two genomes that read
# differently must never produce the same brain (requirement G1).

seed = 20260809

[sim]
dt_ms = 1.0                 # 1 kHz simulation
max_delay_ticks = 32        # ring depth; caps the longest axonal delay
conduction_velocity = 0.1   # spatial units per ms
plasticity_interval_ticks = 10   # cash eligibility in at 100 Hz

[stdp]
a_plus = 0.010
a_minus = 0.012             # slightly depression-dominant, the usual guard
                            # against runaway potentiation
tau_plus_ms = 20.0
tau_minus_ms = 20.0
tau_elig_ms = 2000.0        # the human-feedback window: how long a synapse
                            # stays eligible for a "good baby!" that arrives late
eta = 0.35                  # reward-gated learning rate
reward_clip = 2.0           # one poke must not be able to flatten a brain

# DNA v16. Time constant of a per-synapse running mean of the eligibility trace,
# subtracted before reward cashes it in — the reward baseline's trick one level
# down. 0 is v15 exactly.
#
# Why: `eligprobe` measures the trace on central->vocal as large but object-
# blind, correlating +0.93 between the two objects. Reward can therefore only
# scale that tract, which is exactly the G3 symptom. Subtracting a per-synapse
# mean turns the correlation rule into a covariance rule and leaves only the
# part of the trace that is unusual for that synapse.
# MEASURED AND REFUTED, 2026-08-15, before it ever shipped on. With the baseline
# at 30 s the raw trace is unchanged (0.570) but what reward multiplies falls to
# 0.503 — chance. The per-synapse mean was already being removed by the readout
# that measured the problem, so subtracting it again online only adds the lag and
# noise of a running estimate. Kept in the genome at 0 because the mechanism is
# correct and cheap, and the next covariance-flavoured idea should start here
# rather than rebuild it.
elig_baseline_tau_ms = 0.0

# DNA v37. The timescale of the per-neuron baseline burst rate that
# burst-dependent plasticity reads its learning signal as a deviation from.
# 0 disables the mechanism brain-wide.
burst_baseline_tau_ms = 0.0
# DNA v17. Fraction of the presynaptic module's population-mean trace to
# subtract before the potentiation term reads it. 0 reproduces v16 exactly.
#
# The rule is a product of two rates, and splitting each into a population mean
# plus a deviation shows only the d_i*d_j term is conjunctive while mean_i*mean_j
# dominates. That is the same common-mode swamping `projprobe` measured in the
# tract: subtracting each trial's population mean restores the object from 0.510
# to 0.940 out of vision and 0.500 to 0.690 out of central. This is that
# operation moved into the learning rule.
#
# MEASURED AND REFUTED, 2026-08-15, before it ever shipped on. Scored on
# `condprobe`, which is the only instrument that isolates conditioning — it
# delivers the condition by ear at 0.732 instead of by eye at chance, so a null
# cannot be blamed on delivery. The quantity is the *margin*, taught minus its
# own random-target control, because the creature reacts to a word natively
# (echo 0.825 untaught) and that reactivity sits in both arms:
#
#   seed        centre 0.0   centre 0.5   echo @0.5
#   20260809      -0.002       +0.051       0.750
#   77001         +0.039       -0.020       0.850
#   313377        -0.003       +0.014       0.675
#   mean          +0.011       +0.015
#
# The first family alone looked like the first real learning signal in the
# project (+0.051, 4 of 5 creatures beating their control). Across three
# families the mean margin moves +0.011 -> +0.015, the sign flips on 77001, and
# beat-its-own-control goes 7/15 -> 9/15, which is chance. At 1.0 it is worse
# than useless: the calibration echo collapses 0.750 -> 0.575 because full
# centring starves the word-driven drive.
#
# Kept at 0 because the mechanism is right in principle and costs one multiply,
# and because the *next* conjunctive idea should start from this term rather
# than rebuild it. Note the pattern this now shares with v15 and v16 — three
# mechanisms built, measured and shipped off. See the memory note
# `aibaby-conditioning-is-the-blocker`.
elig_pre_centre = 0.0

[homeostasis]
# Mandatory, not optional (§3.1). Without rate regulation a spiking network
# either falls silent or saturates within minutes, and every measurement after
# that is measuring the bug.
# Homeostasis has to be slow relative to learning, or it is an eraser rather
# than a regulator: it normalises exactly the thing reward is trying to
# differentiate. These constants act over minutes, which is the timescale rate
# regulation is for; reward acts over seconds.
ip_rate = 0.0003            # threshold step per Hz of rate error, per pass
threshold_min = 0.20
threshold_max = 4.00
w_max = 0.50                # |weight| ceiling for excitatory synapses
scaling_rate = 0.02         # firm once the bound is crossed
scaling_band = 3.0          # but silent inside [birth/3, birth*3]
interval_ticks = 500        # twice a second
# Each module carries its own wake/sleep multipliers on the two rates above
# (§3.1 meets §3.6), and the split is the point. Four numbers per module, not
# two: ip_wake_scale/ip_sleep_scale multiply ip_rate, syn_wake_scale/
# syn_sleep_scale multiply scaling_rate. Why they had to come apart is at the
# bottom of this note.
#
# Waking is net-potentiating in a real animal and sleep is when the
# renormalisation happens. Applied globally that does preserve G2's reward
# effect — at 420 s, the duration at which it was recorded as having vanished,
# the rewarded-share advantage goes from +0.0012 to +0.0518 — and it also drives
# the babble duty cycle to 0.93, because the vocal module already sits 1.8 Hz
# above its target and the same dial was holding it down. One number, two
# demands, opposite directions.
#
# Per module the two demands come apart. Measured with `g2`, nine creatures,
# rewarded-share advantage at 200 s and at 420 s, with the babble duty cycle
# beside it — the 420 s column is the one that matters, because decay is what
# the hypothesis is about:
#
#   scheme                            200 s     420 s     won    duty
#   all 1.0 (as before)              +0.0629   +0.0012    5/9    0.67
#   all 0.25/4.0                     +0.0980   +0.0518    5/9    0.93  FAIL
#   vocal 1.0, rest relaxed          +0.0560   +0.0071    6/9    0.63
#   central relaxed only             +0.0165   +0.0279    7/9    0.65
#   vocal + auditory 1.0  <- shipped +0.0372  +0.0564     7/9    0.65
#
# The shipped row keeps more of the effect at 420 s than the drone did, and the
# creature still babbles. Note it does not start higher — it simply does not
# decay: 0.0372 -> 0.0564 where the baseline goes 0.0629 -> 0.0012. That is
# preservation rather than amplification, which is exactly what the hypothesis
# predicts and not what a louder creature would look like.
#
# Why *auditory* has to stay regulated with vocal is the surprise, and the row
# above it is the evidence: relaxing auditory alone costs almost all of the
# preservation (+0.0071). The ears→larynx tract is the densest in the genome, so
# an under-regulated auditory module drives vocal hard enough to swamp the
# reward signal in the very place it has to land.
#
# A real neuromodulator is not global either: it reaches some regions and not
# others, which is the freedom the single dial was missing.
#
# Not free, and not finished. Relaxed modules run hotter under drive — vision
# sits at 6.5 Hz awake against its 4.6 target, where it used to sit at 5.2 —
# and `calibrate` cannot see this, because it measures with homeostasis off.
# `babble` is the check that catches it. And the win counts are 5-7 of 9 across
# every arm, which is not significant on its own; settling that needs the
# treatment the M3 null got, twenty pairs across four seed families.
inhib_plastic = false       # reward retunes excitation only

[growth]
# §3.4: growth without limits masks bugs — the network expands instead of
# revealing that learning is broken. All three conditions must hold, and each
# one of them is a number here rather than a judgement in the code.
enabled = true
plateau_window_ticks = 20000     # 20 s of simulated life per window
epsilon = 0.001                  # prediction-error improvement below this is a plateau
insert_k = 8                     # neurons per growth event
saturation_rate_hz = 20.0        # a module must be this busy...
saturation_weight = 0.60         # ...*and* this far into its weight ceiling
# ...but only if this is 1. Those two bars describe an unregulated network, and
# §3.1's homeostasis is what keeps them out of reach: measured over 25 minutes,
# a healthy creature peaks at 13.5 Hz against the 20 Hz bar, and the share of
# its edges near the weight ceiling *falls* from 2% to nothing as sleep
# downscaling does its work. With this at 1 no creature ever grows outside the
# forced arm of `g4`, which is where every measurement before DNA v5 was taken.
require_saturation = 0
# What replaces it: grow while the creature is still wrong about what happens
# next. The critic's slow error settles at about 0.0084 on this genome and this
# environment, so a floor of 0.004 means "keep developing until you are roughly
# twice as good as you currently get", and a creature that reaches it stops.
error_floor = 0.004
# ...and stop anyway if six growth events in a row fail to move the error.
# §3.4 wants growth to reveal broken learning rather than mask it, and this is
# that sentence made mechanical.
patience = 6
new_weight = 0.02                # small, so a grown neuron earns its place
refractory_ticks = 60000         # one growth event per minute, at most

[consolidation]
# Myelination (§3.5) and sleep consolidation (§3.6). One section because they
# are one mechanism at two timescales: traffic marks the load-bearing edges,
# myelination speeds and protects those, and sleep deletes what traffic never
# reached.
enabled = true

# Traffic settles near (presynaptic rate in Hz) x (tau in seconds), so a half
# of 50 at tau 10 s means an axon carrying about 5 Hz is half-myelinated —
# which is roughly what the modules free-run at.
traffic_tau_ms = 10000.0
traffic_half = 50.0
delay_floor_frac = 0.5           # a fully myelinated axon is twice as fast
eta_floor_frac = 0.3             # ...and learns at 30% of eta: consolidated,
                                 # and protected from being overwritten

# Sleep. The pass runs every 30 s of a sleep bout, which is about six times per
# ~3 min bout.
interval_ticks = 30000
downscale = 0.98                 # uniform, so relative strengths survive
downscale_floor = 0.60           # ...but never past 60% of what the structure
                                 # entitles a neuron to, or a long life fades
prune_weight = 0.004             # weak...
prune_traffic = 1.0              # ...and idle. Both, or it is not unused.

# DNA v38. Competitive pruning: a synapse under this fraction of the MEAN |w|
# over its target's afferents is removed, with no idle test. 0 = off, which is
# the pre-v38 rule. The idle test is what the exuberance post-mortem measured as
# the binding constraint — every synapse in an exuberant tract carries traffic,
# so nothing could ever qualify and selection had no gradient.
prune_compete = 0.0
prune_compete_min_in = 8         # too few afferents to compete is not competition
replay_episodes = 8
replay_ticks = 400               # 400 ms each, against a 2 s eligibility trace
replay_threshold = 0.05          # only moments that beat expectation are kept

[drives]
hunger_rate = 0.0000017     # per ms — empty to full in roughly ten minutes
comfort_decay = 0.0005      # relaxes to neutral with a ~2 s time constant
fatigue_rate = 0.00017      # scaled by activity, so a busy brain tires first
curiosity_weight = 1.0
w_external = 1.0
w_hunger = 0.5
w_comfort = 0.5
reward_baseline_tau_ms = 8000.0   # learning follows surprise, not reward
# Sleep (§3.6). Awake, fatigue only rises; sleeping is the only thing that
# discharges it, which is what makes sleep a state the creature needs rather
# than a timer that happens to it. At the rates below a baby babbling at ~5 Hz
# is awake for roughly eleven minutes and then sleeps for about three.
fatigue_recovery = 0.0000030   # per ms while asleep
sleep_threshold = 0.90
wake_threshold = 0.35

[audio]
# The cochlea (§5.2). Mel spacing and log compression are what the real one
# does, and they cut dimensionality by ~50x against raw FFT bins.
sample_rate = 16000
window = 512                # 32 ms
hop = 256                   # 50% overlap -> 62.5 frames/s
mel_channels = 24
mel_low_hz = 50.0
mel_high_hz = 7000.0
floor_db = -60.0            # anything quieter than this is silence
# How loud the baby is to itself (§5.3). The loop from larynx to cochlea is
# what makes babbling have a consequence the creature can learn from; with it
# at 0 the creature is deaf to itself, which is how every measurement before
# DNA v6 was taken. It is also a positive feedback path — larynx to ear to the
# dorsal tract and back — so it is set below the caregiver's 0.5 rather than at
# the bone-conduction level a real infant hears.
# Swept 0.0 .. 2.0 against `babble`: the loop turns out to be *negative*
# feedback, not the howl that was expected. Louder self-hearing drives the
# auditory module, the dorsal tract carries that to the larynx, vocal rises
# above its setpoint, and intrinsic plasticity answers by raising thresholds —
# so the creature gets quieter, monotonically: duty cycle 0.84 deaf, 0.73 at
# 0.35, 0.59 at 0.7, 0.39 at 2.0. That makes this the dial on the duty cycle
# that the genome never had.
#
# 0.5 is where the headroom is bought without knocking the auditory module off
# its calibrated operating point: duty 0.67, auditory 4.62 Hz against a 4.50
# target. At 0.6 auditory falls to 4.07 and `calibrate` calls it stale.
self_gain = 0.5
gain = 0.40                 # injected current per unit normalised band energy

[vision]
# The retina (§5.1). Foveated because the data budget says so: a uniform 64x64
# grid would be 4096 numbers per frame for a creature whose whole education is
# a few thousand interactions. Full acuity in the middle 16x16, halving with
# every ring outward, gives 88 centre-surround cells — 176 ON/OFF responses.
frame_size = 64             # grayscale square the browser sends
fovea_size = 16             # central region at full acuity
fovea_grid = 8              # 8x8 cells across the fovea -> 2x2 px each
ring_grid = 4               # 4x4 cells per ring, middle four dropped
center_sigma = 0.5          # difference-of-Gaussians, in cell pitches
surround_sigma = 1.6        # wider than the centre, or there is no opponency
contrast_gain = 0.30        # DoG response that reads as full scale
contrast_floor = 0.06       # below this a cell stays silent: an empty field
gaze_contrast_floor = 0.015 # DNA v34: the same threshold, for AIMING. Setting
                            # it equal to contrast_floor above is the pre-v34
                            # creature exactly.
#
# THIS IS WHAT FIXED PERIPHERAL ACQUISITION, and the diagnosis was three
# refutations deep before it turned up. `gazeprobe` had said for a long time
# that the reflex recovers 72% of the oracle gain inside the fovea and NOTHING
# outside it (vision 0.440 against a fixed 0.540 — it made things worse), and
# the standing story was that the retina simply cannot see out there.
#
# It can. Released from the centre with one toy in view, the eye walks to it:
#
#   toy at    0    2    4    6    8    12    16    24 px
#   eye ends  0  1.4  3.1  5.9  7.3  11.4  15.6   REFUSED
#
# Acquisition was never the problem out to 16 px. What happens at 24 px is that
# whole-frame contrast falls to 0.0225 and the controller REFUSES to move,
# because it shared `contrast_floor` with the encoder — one number doing two
# jobs. Perception should be conservative; acquisition should be twitchy, since
# a wasted saccade costs one frame and not looking costs the object entirely.
# That is what a retinotectal pathway is: the colliculus drives saccades from
# signals the geniculate pathway cannot resolve into a shape yet.
#
# Splitting them, at scatter 0.25 (toy 12.1 px out):
#
#   floor    OUTSIDE vision   gaze err   INSIDE     empty-field drift
#   0.060    0.440            11.4 px    0.870/1.3  0.0 px   <- was shipped
#   0.030    0.700             7.5 px    0.870/1.3  0.0 px
#   0.020    0.740             3.1 px    0.870/1.3  0.0 px
#   0.015    0.860             2.0 px    0.870/1.3  0.0 px   <- shipped
#   0.010    0.900             1.3 px    0.870/1.3  0.0 px
#   0.008    0.900             1.3 px    0.870/1.3  0.0 px
#
# Monotone with a plateau, and the INSIDE column is FLAT across the whole range
# — this costs nothing where the reflex already worked.
#
# Why 0.015 and not 0.010, which scores better. The control that matters is an
# empty field: the floor exists to stop the eye chasing grain. Empty-field
# contrast across the nine seeds is 0.0052 .. 0.0064, so 0.015 sits 2.3x above
# the worst of it while 0.010 sits 1.6x. The gain between them (0.860 vs 0.900)
# is inside this instrument's noise at 100 trials; the safety margin is not.
# A real camera is noisier than this renderer, so take the margin.
#
# Replicated on all nine seeds at 0.015: OUTSIDE vision 0.760 .. 0.940
# (mean 0.847 against a fixed 0.540 and an oracle 1.000 — 67% of what is
# available), gaze error 1.3 .. 2.0 px, and 0.0 px of empty-field drift on
# every one.
                            # has to *be* empty, not merely late
gain = 1.30                 # one latency spike's worth of injected current
frame_hz = 10.0             # camera frames the module is born expecting
latency_ms = 60.0           # full contrast fires now, threshold contrast this

# --- DNA v31: pointing the eye, second attempt --------------------------------
# v27 aimed at the response-weighted centroid over every ganglion cell, landed
# ~4.4 px from the toy where the visual code needs ~1.4, and was deleted in v30.
# Deleting it is what produced the number that makes this worth rebuilding: with
# the fovea placed exactly on the toy, `vision` reads 0.980 at 12 px of
# displacement where a fixed eye reads 0.540, and `central` 0.860 against 0.520.
# The mechanism was always worth having; only the aim was wrong.
#
# This one takes the PEAK-responding cell rather than the centroid — a centroid
# averages the object with everything else, and a coarse ring cell that merely
# overlaps it contributes its own faraway centre — and it ITERATES, correcting
# `gaze_gain` of the error every re-aim rather than making one open-loop jump.
# Three re-aims at 0.7 leave 2.7% of the initial error. Once the object is in
# the fovea the peak cell *is* a foveal cell, so the last correction happens at
# 2x2 px for free.
#
# `gazeprobe` scores it between the two rows that bracket it: `fixed` is the
# floor, `oracle` is the ceiling, `reflex` is this.
# SWITCHED ON 2026-08-17, and this is the change that moves the creature's
# identity: the determinism hash goes be2e508dfc170240 -> 15b5dcb6d8616452.
# Every hash quoted elsewhere in this file, and every visual number recorded
# anywhere in this project before today, was taken with the eye NAILED TO THE
# FRAME CENTRE. Those statements are true of when they were written and are not
# re-measurements waiting to happen; `gazeprobe` keeps `fixed` as a permanent
# arm so the old baseline stays reachable inside the instrument.
#
# Turned on for the live path rather than for a milestone, and the split is
# worth being honest about:
#
#   standard protocol (toy +/-1.3 px)   central 0.700 -> 0.800, inside 1 sd
#   displaced (a real camera)           vision  0.520 -> 0.840, gaze 3.8 -> 1.3 px
#
# The headless experiments hand the creature a pre-centred object and will not
# notice. A webcam does not, and until now the shipped creature only worked if
# the world was polite to it.
#
# It cost nothing to switch on, which was not the expectation: `calibrate`
# passes with ZERO recalibration rounds and the babble duty cycle is unchanged
# at 0.51. The retina's output statistics barely move because it is the same
# cells with the same normalisation, sampling a shifted window.
gaze_rate_hz = 10.0         # DNA v31: re-aim once per retinal frame. 0 pins the
                            # fovea at the centre, which is the pre-v31 creature
gaze_gain = 0.70            # fraction of the estimated error per re-aim
gaze_peak_frac = 0.70       # aim at the centroid of cells >= this x the peak;
                            # 1.0 = the peak cell alone, 0.0 = v27's whole field
gaze_peak_radius = 0.0      # DNA v33: 0 = unlimited, the v31 rule exactly.
#
# SHIPS OFF — built against a hypothesis that measured false, and kept for the
# refutation. v31 averages every cell above `gaze_peak_frac` x the peak
# regardless of where it sits, so the obvious story for why the reflex cannot
# acquire a peripheral toy is that foveal noise cells drag the aim back to the
# centre. Making the neighbourhood spatial does not help:
#
#   radius   INSIDE the fovea      OUTSIDE it
#   0 (v31)  0.870, gaze 1.3 px    0.440, gaze 11.4 px
#   6        0.740, gaze 4.5 px    0.480, gaze 12.7 px
#   10       0.640, gaze 2.5 px    0.460, gaze 11.4 px
#   16       0.830, gaze 1.3 px    0.440, gaze 11.4 px
#   24       0.870, gaze 1.3 px    0.440, gaze 11.4 px
#
# The gaze error outside the fovea is flat at every radius, and a tight radius
# makes aiming WORSE inside it. The reason is that there is no estimate to
# protect: `fixed` reads vision 0.540 at 12.1 px, which is chance, so the
# retina does not localise the toy out there at all. Peripheral acquisition is
# a retina problem, not a controller one.
#
# 0.70 is measured, not chosen, and the sweep is unusually legible because both
# previously refuted designs sit at the ends of this one knob. At scatter 0.10
# (toy 4.9 px out), gaze error against gaze_peak_frac:
#
#   0.20  3.3 px   too inclusive: v27's whole-field dilution coming back
#   0.35  3.0 px
#   0.50  2.0 px
#   0.70  1.4 px   <- the tolerance the visual code actually needs
#   0.90  2.9 px
#   1.00  5.5 px   pure peak cell: parked on the object's edge, one radius out
#
# Chosen on gaze error rather than on the classifier score: it is the quantity
# the controller actually controls, and at 100 trials a held-out accuracy has a
# standard deviation near 0.07 while the mean gaze error does not.
                            # much later; the image is in the timing


[touch]
gain = 0.50
duration_ms = 250.0         # a touch lingers; it is not a single tick

[vocal]
# The vocal tract (§5.3). These ranges are body plan — a baby with different
# formant limits is a physically different creature.
f0_min = 90.0
f0_max = 400.0
f1_min = 250.0
f1_max = 1000.0
f2_min = 700.0
f2_max = 2600.0
f3_min = 1800.0
f3_max = 3400.0
bw_min = 50.0
bw_max = 250.0
voicing_threshold = 0.42    # normalised group activity that opens the glottis
smoothing_ms = 800.0        # articulator inertia: a posture is held for a syllable
gate_smoothing_ms = 60.0    # the glottis is a valve; it opens and shuts fast
rate_norm_hz = 10.0         # group rate that reads as full scale

[curiosity]
learn_rate = 0.02           # LMS rate of the forward model
fast_tau_ms = 2000.0
slow_tau_ms = 20000.0
gain = 2.0                  # learning progress -> reward

# Predictive coding (DNA v15). How much of the predicted next frame is taken off
# the frame the ears deliver. 0 is DNA v14 exactly, bit for bit: the forward
# model still runs and still pays curiosity reward, it just never reaches a
# neuron. 1 makes B2 a pure error module.
#
# Measured across the range, and it behaves: energy delivered to B2 falls
# 100% -> 57% -> 19% at gain 0 / 0.5 / 1.0, with 0 / 31% / 41% of channel-frames
# rectified away, and B2's mean rate 3.39 -> 2.63 -> 2.35 Hz.
#
# Note for anyone who turns it up: **at gain 1.0 `--experiment audio` FAILS, and
# correctly.** That test asks whether a sustained vowel raises B2's rate, and a
# sustained vowel is exactly what a predictive-coding ear cancels — the creature
# has become an onset detector, which is what the mechanism is for. The test
# would need rewriting around onsets before full subtraction could ship.
#
# It is off for a different reason: the prediction is not worth subtracting. The
# critic loses to "the next frame looks like this one" in every condition, and
# the association module it reads carries no information about the sound at all
# — see `pcprobe`, and the auditory->central density note further down.
predict_gain = 0.0

# What the forward model predicts: the absolute frame (0, the model this
# creature has had since M1) or the change from the last one (1). Measured in
# `pcprobe` before this switch existed — the absolute model loses to
# persistence in every condition and does not learn its way out.
persistence_base = 0

[normalisation]
# Divisive normalisation (DNA v12). Cortex divides a neuron's drive by how
# active its neighbourhood is; before v12 this creature did not. The measurement
# that motivated it is in `g3probe`: the association module carries
# cube-versus-ball in 4% of its neurons where the vision module feeding it
# carries it in 22%.
#
# Two things were believed when this was built and the measurement refuted both.
#
# 1. "Central's code is too dense, sparsen it." Relaxing central's intrinsic
#    plasticity does sparsen it — population sparseness 0.91 -> 0.85 -> 0.79 as
#    ip_wake_scale goes 0.25 -> 0.05 -> 0.0 — and separability *collapses to
#    chance* at zero, because nothing is left holding the neurons in their
#    dynamic range. Sparser is not better on its own.
# 2. "Normalisation will sparsen it properly." It does the opposite: sparseness
#    rises with gain, 0.913 -> 0.939 across the sweep below, while separability
#    improves anyway.
#
# What it actually does is raise per-neuron discriminability by dividing out a
# common-mode "how busy is this module" term riding on every neuron at once.
# Central, five creatures, 600k ticks, `g3probe`:
#
#   central norm_gain   cube/ball   mean |d'|   sparseness   M2    duty
#   0.0 (off)             0.621       0.177       0.913      93%   0.61
#   0.5                   0.715       0.193       0.928      96%   0.63
#   1.0                   0.736       0.202       0.933      96%   0.62
#   2.0                   0.685       0.197       0.937      94%   0.62
#   4.0                   0.723       0.197       0.939      89%   0.61
#
# Read mean |d'| rather than the accuracy column: 400 neurons x 93 probes is a
# far more stable statistic than a classifier on ~46 training samples, whose
# shuffled control wanders 0.515-0.591 across these same arms.
#
# Confirmed across three seed families before being switched on. mean |d'| at
# central rises in all three (+0.025, +0.006, +0.045) and M2 rises in all three
# (93->96, 97->98, 94->95). The cube/ball *accuracy* column moves much more
# erratically (+0.039, -0.008, +0.196 on the margin) and should not be quoted as
# the headline — one family carries almost all of it.
#
# What it does NOT do: move G3. The ceiling reads 0.505 off and 0.488 on. The
# condition side improving while the voice does not is the cleanest evidence yet
# that G3 is two problems and this is only the first of them.
#
# Only `central` uses it; every other module is at 0.0, which makes the factor
# exactly 1.0 and that module bit-identical to a v11 one. Verified both ways:
# with all gains at 0 the whole brain hashes 7b2e385d6ef2faf5, exactly as v11
# did, and gains of 1.0 and 4.0 give distinct hashes, so the mechanism is
# provably inert when off and provably live when on. The shipped genome hashes
# 0ebf3dad6155254b — every G2/G3 number recorded before DNA v12 was taken on a
# different creature and is stale.
enabled = 1
floor = 0.25               # the most a busy module may be divided down
ceiling = 2.0              # and the most a quiet one may be amplified back up

[exploration]
# LMAN: motor variability that reward opens and closes (§5.3's "motor noise",
# made a variable instead of a constant).
#
# Babble came from a fixed noise_amp, and a fixed exploration rate is the one
# thing that cannot converge — the creature was exactly as random after a
# hundred praises as on its first babble. A zebra finch does the opposite:
# LMAN *injects* variability into the motor pathway, undirected practice is
# variable, directed song is stereotyped, and lesioning LMAN abolishes the
# variability and the learning together.
#
# The performance signal is the gap between two windows on total reward, and it
# has to be a gap: the reward prediction error the synapses see is reward minus
# its own running mean, so it averages to zero by construction and cannot tell
# doing-well from doing-badly. Fast above slow means better than lately.
# Ships off. The mechanism is built and provably inert here — the creature is
# bit-identical to one compiled before it existed — but a *global* variability
# gain measured net harmful, and the reason is instructive rather than a tuning
# miss. See the note below the parameters.
enabled = 1
fast_tau_ms = 4000.0        # about a handful of vocalisations
slow_tau_ms = 60000.0       # the reference the fast window is judged against
sensitivity = 0.0           # how hard that gap moves exploration
floor = 0.35                # most stereotyped the creature may become
ceiling = 1.60              # ...and most exploratory. 1.0 is plain noise_amp
                            # exactly, which is where it sits with enabled = 1
# The HVC term. Without it, closing exploration does not make the larynx
# stereotyped — it makes it silent, because in this creature the motor module's
# spontaneous drive *is* its babble. Measured at sensitivity 500 without it:
# five of nine creatures produced too few vocalisations to score.
drive_compensation = 0.5

# Directional exploration: node perturbation. Each neuron traces the random
# numbers it was actually given, and when reward arrives its excitability moves
# along that trace. A push that preceded a better-than-expected outcome is
# kept. This is the part that *steers* variability rather than shrinking it,
# and it is a second learning rule beside STDP.
#
# The trace decays on the reward's timescale rather than the membrane's: the
# caregiver's "good baby" lands a second or two after the thing it liked, which
# is the same argument that sets tau_elig.
perturb_tau_ms = 2000.0
#
# This is the parameter G2 turns on. Swept against `g2` at 200 s, nine
# creatures, with the scalar gain above held at zero so only the directional
# part is acting:
#
#   rate      rate advantage   won    mean ratio
#   3e-6      +0.312x          7/9    x0.95
#   1e-5      +0.580x          9/9    x1.20
#   3e-5      +0.936x          9/9    x1.35   <- shipped
#   5e-5      +0.888x          7/9    x1.34
#   1e-4      +0.667x          5/9    x1.46
#   1e-3      -0.123x          4/9    x1.01
#
# A plateau between 1e-5 and 3e-5, falling away on both sides: too slow and the
# gradient estimate never accumulates against the noise, too fast and each
# creature chases single lucky perturbations. 3e-5 over 1e-5 because it is the
# one that also carries the *absolute* clause at 420 s (x1.11 against x0.94),
# where 1e-5 has the cleaner win counts.
perturb_rate = 0.00003
perturb_max = 0.30          # |bias| ceiling, in the same units as threshold

# DNA v41 — metaplastic consolidation. Node perturbation is an unbiased gradient
# estimate, so a neuron that cannot affect the current reward is already being
# told "you get nothing" — as zero-mean noise, which random-walks whatever it
# had already learned. `driftprobe` measures the cost: while one vocal group is
# taught, the other diffuses just as hard with 9x less directional motion.
#
# Each neuron gates its own plasticity on E[u]^2 / E[u^2] over its own updates:
# 1 means every update agrees, 0 means pure noise. The window is counted in
# REWARD EVENTS, because silence is not evidence either way. SHIPS OFF —
# meta_window = 0 takes the pre-v41 path and is bit-identical.
meta_window = 0.0           # reward events in the window; 0 disables
meta_floor = 0.25           # plasticity left to a neuron whose updates are noise
meta_ref = 0.15             # the SNR that already counts as fully consistent
meta_commit = 0.0           # brake plasticity by how far this neuron already moved; 0 off
meta_flow = 0.0             # Benna-Fusi: leak the bias toward a slow store; 0 off
meta_ratio = 0.05           # how much slower that store is than the bias

# --- what the two halves of this section are for ------------------------------
#
# `sensitivity` above stays 0: a *scalar* gain on the noise measured worse than
# nothing, and the note below records why. `perturb_rate` is the half that
# works, and it is what carries G2. They are separable on purpose — the failure
# of the first is the reason the second exists.
#
# G2 with directional exploration on, nine creatures per family:
#
#   200 s, seed 20260809   +0.936x   9 of 9   x1.35   PASS
#   200 s, seed 20360812   +0.593x   6 of 9   x1.30   PASS
#   200 s, seed 20451117   +0.504x   8 of 9   x1.39   PASS
#   420 s, seed 20260809   +0.672x   9 of 9   x1.11   PASS
#
# Both clauses, at both durations, across three independent seed families. The
# 420 s row matters most: that is the duration at which every previous version
# of this creature had lost the effect entirely.
#
# **Read the advantage column with one correction.** Praised creatures go from
# x0.742 to x1.347 when this is switched on, and their yoked twins go from
# x0.686 to x0.411 — so roughly a third of the "advantage" is the control being
# *harmed* rather than the creature being helped, because random praise times a
# perturbation trace is a random walk in excitability and that damages a
# creature. Arguably it should: a baby praised at random ought to learn
# nonsense. But the milestone does not rest on it. x1.347 is the praised arm on
# its own, and the absolute clause is met without reference to any control.
#
# --- the half that did not work ----------------------------------------------
# Why the scalar gain ships off, and what made it wrong.
#
# Measured with `g2`, nine creatures, sensitivity 500 and 1000, with the HVC
# term in place: mean rewarded ratio x0.35 and x0.15 against a x0.72 baseline,
# and three of nine creatures too quiet to score. Worse than doing nothing.
#
# The signal is systematically one-sided. `fast - slow` trends positive as the
# drives settle over a session, so exploration closes monotonically — mean 0.87
# — and the creature narrows early, before it has learned anything to narrow
# onto. A songbird does the opposite: wide early, stereotyped late.
#
# But the deeper error is the shape of the mechanism, not the sign of its input.
# A single scalar gain on the noise makes the larynx *less varied in every
# direction at once*, which is not what LMAN does and not how node perturbation
# works. Real exploration is **directional**: each neuron's own recent
# perturbation is correlated with the reward that followed, and the ones that
# helped are kept. That steers the variability instead of merely shrinking it,
# and it is the difference between narrowing onto something and going quiet.
#
# Building that means a second learning rule beside STDP — a per-neuron
# perturbation trace, cashed against reward the way the eligibility trace
# already is. The scaffolding here is what it would need: the two reward
# windows, the per-module delivery, and the HVC term that keeps a narrowing
# creature audible.
#
# --- the third half that did not work: perturbation on SYNAPSES ---------------
# Built 2026-08-19, measured, and removed the same day. No genome field remains,
# because a required key per dead mechanism is the tax DNA v30 exists to stop
# paying — but this is the last structurally untried learning rule in the
# project, so the table is worth more than the field.
#
# The motivation was the one sentence that summarises G3: this creature has two
# learning rules and *neither* can make the voice a function of what the eye
# sees. R-STDP can in principle and does not — `dwprobe` splits what reward
# writes onto central->vocal into ~61% irreproducible noise, ~31% reproducible
# but object-independent and ~8% object-specific. Node perturbation cannot even
# in principle, because `perturb_rate` above moves a per-neuron *constant*.
#
# The obvious repair is to cash the same trace onto synapses under a
# presynaptic gate — `e_ij += k * perturb_j` on every spike of i, which is
# Fiete & Seung's rule written on weights, and in the birdsong model this
# section borrows from it is the HVC->RA synapse. It is conditional by
# construction: credit lands only on synapses whose source was firing, so a cube
# and a ball write onto different ones.
#
# It does something large, and on the wrong column. `dwprobe`, 3 creatures,
# 120k, with `k` the raw gate and `c` the fraction of the source module's mean
# firing subtracted back off:
#
#   k       c     mean|dw|    corr(A,A')  corr(A,B)   noise   obj-indep  obj-spec
#   0       -     2.99e-02    0.349       0.322       65%     32%        2.7%
#   1e-4    0     5.98e-02    0.815       0.794       19%     79%        2.1%
#   1e-4    1.0   3.61e-02    0.460       0.449       54%     45%        1.1%
#   3e-4    0     9.30e-02    0.917       0.910        8%     91%        0.7%
#   3e-4    1.0   5.52e-02    0.687       0.644       31%     64%        4.3%
#   1e-3    1.0   9.28e-02    0.688       0.658       31%     66%        3.0%
#
# Read the last three columns. The rule cuts the irreproducible share of
# learning from 65% to 8% — nothing in this project had moved that column at all
# — and every point of it lands in the object-INDEPENDENT one, 32% -> 91%.
# Centring the gate removes that common mode exactly as designed, 91% -> 64%,
# and gives back the calibration echo the common mode was costing (g3probe echo
# 0.700 -> 0.925 at k=1e-4, against 0.850 shipped), which was the falsifiable
# prediction made before the run. **The object-specific column never leaves the
# 1-4% band in any of eight settings.** G3's margin over its own random-target
# control: +0.017 shipped, +0.022 at the best arm, mean -0.006 across the grid,
# 0 of 5 creatures at the bar everywhere. Above k=3e-4 the echo falls under
# g3probe's 0.700 floor and those arms are unreadable rather than negative.
#
# **The control that says why, and it is the useful part.** Run G2 with the bias
# half switched off, so the synaptic rule is the only exploration there is:
#
#   arm                              rewarded rate   won    G2
#   bias half only (shipped)         +1.742 x        9/9    PASS
#   synaptic half only               -0.031 x        5/9    FAIL
#   neither half                     -0.081 x        3/9    FAIL
#   both                             +1.700 x        7/9    PASS
#
# The synaptic rule sits at the no-exploration floor. It cannot carry G2 — the
# milestone the *bias* version met outright — so this is not a failure of
# conditionality at all. Both rules estimate the same gradient from the same
# reward stream; the bias version estimates one number per neuron and the
# synaptic version one per synapse, and the variance of the second is hopeless
# at these session lengths. Note the last row: adding it to the working rule
# makes G2 slightly worse, 9/9 -> 7/9.
#
# Two things this closes. **Expressiveness was never the problem** — the reason
# node perturbation cannot make the voice conditional is not that a bias is a
# constant, and giving it the expressive power does not help. And **the SNR
# framing of G3 is refuted**: dwprobe's 61/31/8 split invited "raise the signal
# or lower the noise", and lowering the noise by 8x moves the object-specific
# share not at all.

# --- Modules ---------------------------------------------------------------
# Neuron counts are deliberately small. The point is a substrate we can watch
# at 1 kHz in real time, not a big brain.
#
# `role` is how the host finds a module. Renaming a module is cosmetic;
# changing its role rewires the creature to the outside world.

[[module]]
name = "central"
role = "association"
neurons = 400
n_max = 4096
max_out_degree = 512
extent = [1.0, 1.0, 1.0]
conn_radius = 0.4
conn_density = 0.5
# DNA v42 — a synfire chain, laid down at birth. The wiring above is
# distance-based and therefore symmetric, and seqprobe measured that a symmetric
# loop cannot carry a kick forward for even 10 ms (r 0.92 -> 0.03, at every
# weight to 8x). A sequence needs asymmetry AND convergence: a whole group of
# neurons drives the next group, so each cell of the next link gets tens of
# coincident inputs. A per-neuron window gives about three and does nothing. Nothing wraps — a finite chain is a syllable, a wrapping one
# is a loop that sustains forever or seizes. SHIPS OFF at chain_weight = 0,
# which skips the pass and is bit-identical.
chain_weight = 0.0          # 0 disables the whole pass
chain_density = 0.4         # connection probability inside the window
chain_group = 64            # neurons per link; the chain is group k -> group k+1
chain_delay_ms = 3.0        # one link's delay, and so the step of the chain
# Threshold and leak are a pair, and they were swept as a pair: for each leak
# the threshold was searched until the module free-ran at the same 8 Hz, so the
# sweep varies how long the module integrates and holds how hard it fires
# constant. Otherwise "shorter leak" and "quieter module" are the same
# experiment and neither can be read.
threshold = 0.645
v_rest = 0.0
# The senses arrive as volleys, not as levels. The retina fires each cell once
# per frame and early if it responded strongly, so a picture is spread across a
# 60 ms latency window inside a 100 ms frame (§5.1). A 20 ms membrane constant
# integrates most of that window into a sum, which converts the volley's order
# into an amount — and "amount" is exactly the part of B1 that M2 showed was
# doing all the work. At 5 ms the module reads coincidence instead, and the
# measurements move together: M2's held-out accuracy 0.89 -> 0.94, and the same
# score with each trial's firing rate divided out — the honest one, the "where"
# rather than "how hard" — 0.69 -> 0.79. Shorter still keeps helping M2 (0.84
# at 3 ms) but costs G2, which peaks here.
leak_tau_ms = 5.0
refractory_ms = 3.0
target_rate_hz = 6.81  # measured, not chosen: this module's free-running
                             # rate with homeostasis switched off. A target that
                             # differs from it makes intrinsic plasticity spend
                             # the session hauling the network somewhere, and
                             # that drift swamps whatever else is being measured.
                             # The threshold above is what holds this at 8.05
                             # after the leak changed
inhib_fraction = 0.2
inhib_gain = 2.5
weight_init = 0.12
noise_amp = 0.28
# Relaxed while awake and repaid during sleep — see the [homeostasis] note.
# This is where G2's reward effect was being erased mid-session.
ip_wake_scale = 0.25
ip_sleep_scale = 4.0
syn_wake_scale = 0.25
syn_sleep_scale = 4.0
explore_scale = 0.0        # not a motor module; keeps its plain noise_amp
norm_gain = 1.0            # the one module that uses it. Chosen by the sweep in
eta_scale = 1.0            # cortical rate; see ModuleRole::kHippocampus
# DNA v20 neuromodulator channel gains; read only when [neuromod] enabled.
nm_external = 1.0
nm_hunger = 1.0
nm_comfort = 1.0
nm_curiosity = 1.0
# DNA v21 pooling interneurons: subtract the gain below times the population
# mean rate of the named source module from every neuron here. -1 disables.
#
# MEASURED 2026-08-16 with vocal pooling from vision, on the genome that has a
# strong vision->vocal tract. Note the scale: mean_rate_fast is in Hz (~5), so a
# gain of 0.05 subtracts 0.25 from the drive every tick against a threshold of
# 1.0 and silences the module outright. The useful range is near 0.002.
#
#   ffi      cal    duty   vocal-obj  vocal-int  voice   vocal-spk
#   0.000    PASS   0.69   0.680      0.720      0.640   1065.5
#   0.002    PASS   0.56   0.790      0.730      0.590    954.8
#   0.005    PASS   0.31   0.610      0.680      0.570    788.4
#   0.010    PASS   0.06   0.500      0.520      0.500    527.6
#   0.020    PASS   0.00   0.510      0.530      0.510     75.5
#
# It does NOT do what it was built for. The split-half column jumps to 0.790 but
# the interleaved one — the trustworthy column — moves only 0.720 -> 0.730, and
# the voice falls. The reason is a timescale mismatch: mean_rate_fast is a
# one-second EMA while the common-mode fluctuation that buries the object code
# is trial-to-trial. A constant offset is invisible to the classifier anyway,
# because holdout_accuracy z-scores every dimension; only the fast part matters
# and this term cannot follow it. A faster pool is the thing to try next.
#
# What it IS good for: at 0.002 it restores the operating point that a strong
# vision->vocal tract disturbs — duty 0.69 -> 0.56, spikes 1065 -> 955 against a
# 944.9 baseline — while holding delivery. Useful as that tract's companion.
#
# DNA v22 tested the timescale explanation and REFUTED it. With a dedicated
# 15 ms pool ([interneuron] tau_ms) instead of the one-second EMA, the
# interleaved column goes 0.720 -> 0.700 -> 0.700 -> 0.660 across gains
# 0 / 0.001 / 0.002 / 0.005 — monotonically *down*. Speed was not the problem.
#
# The actual reason the offline result does not transfer, worked out from the
# algebra: projprobe's `centred` arm computes y_j = sum_{i in S_j}(x_i - m),
# which equals sum(x_i) - |S_j| * m. This term computes sum(x_i) - g * m. The
# two agree only if every target has the same fan-in, and at density 0.03 over
# ~1024 sources |S_j| is Poisson with mean 31 and spread +/-5.5, about 18%. A
# uniform subtraction over-corrects the sparsely innervated neurons and
# under-corrects the densely innervated ones, and the residual scales with the
# very common mode it is supposed to remove.
#
# So the next form is not a faster pool but a **per-neuron** one: scale the
# subtraction by each target's own in-degree from the source module. That is
# also what a real basket cell does — its innervation is proportional to the
# target's excitatory input, not uniform across the population.
#
# DNA v24 DID THAT AND IT WORKS. `ffi_gain` is now weighted per neuron by how
# much of the source module that neuron actually receives, normalised to mean 1
# so the gain keeps its old scale. Measured at ffi 0.001 against 0, three seed
# families, each recalibrated, all passing and all babbling:
#
#   seed        ffi 0.000   ffi 0.001   delta    voice
#   20260809      0.720       0.780     +0.060   0.640 -> 0.580
#   77001         0.670       0.720     +0.050   0.630 -> 0.550
#   313377        0.760       0.880     +0.120   0.550 -> 0.650
#   mean          0.717       0.793     +0.077
#
# Three of three positive, no sign flip. This is the first *constructed*
# improvement in a long run of refutations, and the fan-in algebra earned it:
# the argument predicted both that a uniform term would fail and that an
# in-degree-weighted one would work, and both held.
#
# The voice does not follow (0.607 -> 0.593 mean, two down one up), which is
# what the rest of the evidence predicts — delivery improves, behaviour does
# not, because conditioning is the blocker. Still shipped off: it is only worth
# turning on together with the vision->vocal tract it was measured against.
#
# THAT TEST WAS FINALLY RUN, 2026-08-17, and it settles the question this note
# left open. The bundle — `vision->vocal` at d=0.03 w=0.30 plus this pooling —
# was assembled, **recalibrated** (it fails `calibrate` untouched: central
# -0.40, somato +0.46, duty 0.51 -> 0.67), and scored with g3probe at 900k,
# 141 probes per creature, five creatures:
#
#   arm                 obj at vocal   G3 ceiling   echo    readable?
#   shipped             0.480          0.487        0.825   yes
#   + vision->vocal     0.800          0.546        0.750   yes
#   + tract & pooling   0.680          (0.515)      0.675   NO — echo under floor
#
# **Delivery was never the limit.** The object arrives at the larynx with a
# margin over chance roughly three times the shipped creature's, and the
# idealised-teacher ceiling moves 0.487 -> 0.546 against a 0.75 bar, with 0 of 5
# creatures reaching it and only 3 of 5 beating their own random-target control.
# The conditioning diagnosis survives its strongest test.
#
# And a cost nobody had quantified: **the CS pathway competes with the US
# pathway at the same target.** The calibration echo — the word driving the
# voice natively, which is the whole reason conditioning looked possible — falls
# 0.825 -> 0.750 -> 0.675 as object delivery rises, because vision->vocal and
# auditory->vocal land on the same module and the second one dilutes the first.
# In the pooling arm it fell under g3probe's readout floor and that arm is
# unreadable rather than negative. Any future attempt to deliver the object to
# vocal has to pay this, and the two tracts would need separating — different
# target populations, or different compartments — before the trade goes away.
ffi_source = -1
ffi_gain = 0.0
rebound_source = -1          # DNA v44: post-stimulus rebound; -1 disables
rebound_gain = 0.0           # drive += gain * max(0, mean_rate[src] - pool_fast[src])
rebound_mean_tau_ms = 0.0    # DNA v45: subtract the term's own slow mean; 0 = v44
ffi_apical = 0               # DNA v40: land the interneuron on the tuft, not the soma
ffi_learn = 0.0              # DNA v40: and let its weight learn to cancel what arrives there

# --- DNA v25: the apical compartment -----------------------------------------
# A neuron here used to be a point: every synapse summed into one membrane. A
# pyramidal cell is at least two integration sites, and a tract says which one
# it lands on (see `apical` on the projections below).
#
# The tuft integrates on its own slow constant and cannot make the soma fire.
# What it can do is cross `apical_threshold` and start a calcium plateau, and
# for `apical_plateau_ms` after that the soma's synaptic drive is multiplied by
# (1 + apical_gain). Feedforward alone: regular spiking. Feedback alone:
# nothing at all. Both together: a burst.
#
# apical_threshold = 0 disables the compartment on this module, which is what
# every module ships with, and a genome with no apical tract anywhere is
# bit-identical under a v25 core.
apical_tau_ms = 30.0
apical_threshold = 0.0
apical_gain = 0.0
apical_plateau_ms = 50.0

# --- DNA v26: subthreshold oscillations --------------------------------------
# A theta rhythm and a gamma rhythm nested inside it, added to every neuron in
# this module as a current. Both amplitudes 0 is off, and off is bit-identical
# to v25.
#
# Aimed at a measured failure rather than at the fact that cortex oscillates.
# `eligprobe` shows the eligibility trace on central->vocal is large but
# object-BLIND, correlating +0.93 between the two conditions, and the reason is
# structural: pair-based STDP adds `+a_plus * trace_pre` and subtracts
# `-a_minus * trace_post`, both scaling with the same firing rates, so it is
# nearly rate-balanced by construction — while central codes the object as a
# rate difference. It is a timing rule being asked to read a rate code.
#
# On a shared rising ramp a neuron with more drive crosses threshold earlier in
# the cycle than one with less. The rate difference becomes a *timing*
# difference, which is the one thing STDP can see. So the prediction is not
# about accuracy anywhere — it is that the trace on central->vocal becomes
# object-conditional, tested by the probe that found it blind.
#
# Additive, not multiplicative, and the argument above is why: a gain scales
# each neuron's own drive and cannot reorder threshold crossings, while a shared
# ramp makes crossing time a function of drive.
#
# MEASURED HERE 2026-08-17, on central, and REFUTED. Ships off.
#
# The mechanism does everything it was designed to do. `oscprobe` measures
# entrainment and the phase code separately, because an oscillation that never
# entrained and one that entrained and did not help produce the same null:
#
#   gamma_amp   vector strength   rate/phase corr
#   0.01        0.102             +0.182
#   0.03        0.276             +0.286
#   0.06        0.470             +0.403
#   0.12        0.694             +0.553
#
# So central entrains, hard and monotonically, and a systematic rate-to-phase
# mapping appears — which is the whole precondition of the argument. (It runs
# the *opposite* way to the textbook: busier neurons fire LATER, not earlier.
# Two candidates, neither tested — refractoriness spreading a high-rate
# neuron's spikes past the optimal phase, and intrinsic plasticity raising a
# busy neuron's threshold so it needs more of the ramp. Either way a monotone
# map exists, which is all the argument needed.)
#
# And the eligibility trace does not care. `eligprobe` at 600k:
#
#   theta  gamma  cal   duty   cent->voc  shuffled  arcuate  corr
#   0.0    0.0    PASS  0.51   0.654      0.514     0.892    +0.959
#   0.0    0.01   PASS  0.52   0.638      0.476     0.892    +0.961
#   0.0    0.03   PASS  0.53   0.646      0.520     0.896    +0.963
#   0.0    0.06   FAIL  0.55   0.594      0.502     0.888    +0.969
#   0.06   0.0    FAIL  0.66   0.616      0.530     0.882    +0.971
#
# Flat to falling, never better, and the object-INdependent share creeps up
# rather than down. Above amplitude 0.03 the creature stops calibrating, so
# the usable window is entirely inside the region where nothing happens.
#
# The `arcuate` column is on every row on purpose: it is a tract known to carry
# a conditional trace, and it holds at 0.882-0.896 throughout, so no row above
# is a null produced by a blind instrument. The first version of this sweep was
# run at eligprobe's default 120k, where that same control reads 0.570 against
# a chance of 0.510, and the entire table had to be thrown away. `eligprobe`
# now prints an UNDERPOWERED banner when the control falls below 0.700.
#
# **The conclusion is the strong form of the negative.** The rhythm entrained,
# the rate code became a timing code, and STDP still could not use it. This is
# not "the amplitude was too small" — the amplitudes that produce the strongest
# phase code are measured here and they are the ones that make things slightly
# worse. A shared rhythm is itself a large common-mode signal, and common-mode
# swamping is this creature's established failure mode: the oscillation adds to
# the object-blind component of the trace, which was already the problem.
#
# One number here corrects the record. At 600k the baseline trace on
# central->vocal reads 0.654 against a shuffled 0.514, not the 0.520 recorded
# from a 120k run. The trace is not object-BLIND; it is object-WEAK — 0.654
# against the arcuate's 0.892 on the identical readout.
theta_hz = 6.0
theta_amp = 0.0
gamma_hz = 40.0
gamma_amp = 0.0
gamma_theta_coupling = 1.0
critical_tau_ms = 0.0       # DNA v28: 0 = plasticity never closes (pre-v28)
critical_floor = 0.2        # what the learning rate settles to when it does
plateau_gate = 0.0          # DNA v29: 0 = eligibility ignores the tuft (pre-v29)
# DNA v32. Lateral competition, so a population centroid has somewhere to sit.
# 0 is off and is bit-identical to not having it. See the note in dna.h: the
# vocal centroid already reaches F1 300-910 Hz, it just never dwells anywhere.
lateral_gain = 0.0          # strength of local excitation minus the field mean
lateral_sigma = 0.15        # excitation width, as a fraction of one field
lateral_fields = 1          # competitive fields; the vocal module wants 9
burst_ms = 0.0               # DNA v37: ISI that counts as a burst. 0 = no burst code
burst_refrac_scale = 1.0     # what an apical plateau does to it. 1.0 = nothing
elig_tau_scale = 1.0         # DNA v39: this module's tau_elig, as a multiple of the global one


