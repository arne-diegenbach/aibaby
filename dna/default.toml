# auditory -> vocal, INHIBITORY: the baby stops babbling while it can hear
# something. Added 2026-08-18, immediately after the excitatory vision->vocal
# tract above, and it is what makes that tract shippable.
#
# WHY IT HAD TO EXIST. vision->vocal drives the larynx harder, the creature
# babbles more, and it HEARS ITSELF — `self_gain` mixes its own voice into the
# room before the cochlea. Mel energy during silence went 0.0499 -> 0.0830 and
# the `audio` experiment failed: an external vowel no longer lifted the
# auditory module by the 10% it requires. The baby was babbling over you.
#
# That failure was invisible on the default seed. Across the nine seeds the
# experiments actually sweep, `audio` went from 8 of 9 passing to 4 of 9 while
# the default seed sat at 1.15 and looked fine. Never accept a single-seed
# `audio` or `babble` result after a wiring change.
#
# WHAT IT DOES. The ears inhibit the larynx. The creature cannot tell its own
# voice from the room — nothing here can, the mix happens in the cochlea — so
# this suppresses babble whenever ANYTHING is loud, the creature included. That
# is the negative-feedback duty-cycle dial described beside `self_gain`, made
# explicit and given its own weight. Silence quiets while the response to real
# sound does not:
#
#   gate weight     none    0.15    0.25    0.40    0.80
#   audio ratio     1.15    1.34    1.46    1.73    2.13
#   silence rate    5.42    4.44            3.54    2.88
#   vowel rate      6.22    5.70            5.96    6.14
#   babble duty     0.68    0.57    0.52    0.41    0.29
#
# The vowel response is flat and the silence collapses. That is the shape a
# listening reflex should have, and it is why this is not merely a volume knob.
#
# WHY 0.25 AND NOT MORE. Strong gates make the creature too quiet to MEASURE.
# G2 needs enough baseline vocalisations to establish a rate, and at 0.40 two
# creatures came back "inconclusive: 7 baseline / 43 test vocalisations", at
# 0.80 five did and G2 FAILED. Across the nine seeds:
#
#   gate weight     0.15        0.25        0.40         0.80
#   praise won      7 of 9      9 of 9      6 of 7       2 of 4  FAIL
#   creatures       9           9           7            4
#   rewarded rate   +0.781x     +1.361x     +0.950x      +0.442x
#
# 0.25 is a peak, not a plateau, so score any change to this weight over a
# NEIGHBOURHOOD rather than at a point. The neighbours are safe — 0.15 and 0.40
# both still pass G2 — and only 0.80 breaks it.
#
# WHAT IT COST, which turned out to be nothing. The prediction was that this
# must break the echo, since echoing a word means vocalising WHILE hearing it.
# It improves the echo instead: the voice carries the heard word at 0.880
# against 0.840 without the gate, because a quieter creature has a cleaner
# readout and inhibition does not stop it answering. The object delivery the
# vision tract buys also survives (vocal 0.760 -> 0.780).
[[projection]]
src = "auditory"
dst = "vocal"
kind = "random"
source = "inhibitory"
density = 0.25
weight = 0.25
delay_ms = 5.0
delay_jitter_ms = 1.0
hebb = 0.0                # DNA v23: per-pathway Hebbian rate, 0 = reward-gated only
apical = 0                # DNA v25: 1 terminates on the target's apical tuft
exuberance = 1.0          # DNA v28: born at density x this, pruned back by experience
birth_weight = 1.0        # DNA v30: born at weight x this; set to 1/exuberance
stp_use = 0.0             # DNA v36: dynamic synapse. 0 = constant weight, the pre-v36 tract
stp_recover_ms = 0.0      # tau_rec: how fast released resources come back
stp_facil_ms = 0.0        # tau_facil: how long raised utilisation lasts. 0 = pure depression
burst_learn = 0.0         # DNA v37: learn from the target's burst deviation, not from reward


[neuromod]
# DNA v20. Off reproduces v19 exactly: the four reward terms are summed against
# one running baseline and the single scalar reaches every synapse in the brain.
#
# On, each term keeps its own baseline and each module weights the four itself
# through its nm_* fields. The motivation is measured, not tidiness: `dwprobe`
# finds that with the caregiver silent the weights still move 76% as much,
# because hunger, comfort and curiosity are object-blind and pay reward anyway.
# It is also what DNA v19 showed was missing — a global signal potentiates
# everything at once, and a real neuromodulator reaches some regions and not
# others.
#
# MEASURED 2026-08-16. Built, bit-identical when off (hash be2e508dfc170240),
# and it works — but it does not move G3, which was the prediction going in:
# `g3probe`'s clean-teacher run had already zeroed the drives globally and read
# 0.502. Scored on `condprobe` by the margin (taught minus random control):
#
#   arm                        cal    duty   teacher  random  margin   g2
#   off (v19)                  PASS   0.51   0.637    0.639   -0.002   PASS
#   on, all gains 1.0          PASS   0.51   0.620    0.665   -0.045   PASS
#   on, vocal: caregiver only  PASS   0.52   0.594    0.648   -0.054   PASS
#
# All three sit inside the +/-0.05 noise floor. Cutting hunger, comfort and
# curiosity out of the larynx's plasticity entirely — so the caregiver has a
# private line to it — changes nothing measurable.
#
# Ships off because it does not earn a hash change, not because it is wrong.
# The all-ones arm reproduces the summed behaviour (calibrate PASS, g2 PASS,
# duty unchanged), so turning it on is behaviourally neutral and available to
# anyone who wants the extra realism. And the *capability* is the thing DNA v19
# showed was missing: a global signal potentiates everything at once, and this
# is the machinery for a modulator that reaches some places and not others.
# What it still cannot do is separate two tracts that share a target module —
# vision->vocal and auditory->vocal both land on the larynx — which needs
# per-projection plasticity metadata that the kernel does not have.
enabled = false

[interneuron]
# DNA v22. Time constant of the pooling interneurons' estimate of their source
# module's activity (DnaModule::ffi_source / ffi_gain).
#
# v21 reused `mean_rate_fast`, a one-second EMA, and that is why it failed: the
# common mode that buries the object code moves trial-to-trial, and a constant
# offset is invisible to a classifier that z-scores every dimension anyway.
# Only the fast component matters. Real feedforward inhibition acts within about
# ten milliseconds.
tau_ms = 15.0
