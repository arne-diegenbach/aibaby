# So stop tuning it. Everything below was aimed at a tract that carries no task
# signal. Keep it in the genome — it is architecturally the only
# association->motor path, and removing it is a diagnostic rather than a
# proposal — but the next G3 idea should be a route that does not exist yet.
#
# The two knobs, for the record, are also dead ends on their own terms.
#
# `projprobe` records per-neuron activity and applies the projection in
# software — a random sparse binary matrix, the linear part of a tract with no
# threshold and nothing else driving the target. Scoring cube-vs-ball through
# it, against the word from `auditory` as a control:
#
#   arm                    at source   d=0.03   d=0.15   d=0.40
#   object from central    0.820       0.620    0.500    0.490
#   object from vision     1.000       0.980    0.510    0.500
#   word from auditory     1.000       1.000    1.000    0.520
