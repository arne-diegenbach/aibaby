#
# This tract supplies 10.9% of vocal's spikes and that drive is fully replaced
# by turning a noise generator up by 0.04. It is a pipe connected to nothing
# useful: what crosses it is object-independent population activity, which is
# exactly what a random sparse projection preserves (see projprobe). The
# creature has no working route from the association module to the larynx; the
# word only reaches vocal because `auditory->vocal` is a separate direct tract,
# and that keeps working with this one gone.
