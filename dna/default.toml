# DNA v21 pooling interneurons: subtract the gain below times the population
# mean rate of the named source module from every neuron here. -1 disables.
ffi_source = -1
ffi_gain = 0.0
rebound_source = 1           # DNA v44: SHIPPED ON — the ear drives the rebound
rebound_gain = 0.02          # M1d: the answering burst, +0.349 corrected on 6/6 seeds
rebound_mean_tau_ms = 5000.0 # DNA v45: subtract its own slow mean, or it is a tonic lift
ffi_apical = 0               # DNA v40: land the interneuron on the tuft, not the soma
ffi_learn = 0.0              # DNA v40: and let its weight learn to cancel what arrives there

# --- DNA v25: the apical compartment -----------------------------------------
# A neuron here used to be a point: every synapse summed into one membrane. A
# pyramidal cell is at least two integration sites, and a tract says which one
# it lands on (see `apical` on the projections below).
#
# The tuft integrates on its own slow constant and cannot make the soma fire.
# What it can do is cross `apical_threshold` and start a calcium plateau, and
# for `apical_plateau_ms` after that the soma's synaptic drive is multiplied by
# (1 + apical_gain). Feedforward alone: regular spiking. Feedback alone:
# nothing at all. Both together: a burst.
#
# apical_threshold = 0 disables the compartment on this module, which is what
# every module ships with, and a genome with no apical tract anywhere is
# bit-identical under a v25 core.
#
# MEASURED HERE, on the larynx, 2026-08-17. The delivery-solved creature
# (vision->vocal d=0.03 w=0.30), three seed families, 600k ticks = ~300 trials.
# It ships off because it does not beat the route already in the genome.
#
# The operating point is narrow, and finding it comes before believing any
# other number — DNA v11's synaptic scaling was swept for a week before a
# direct measurement showed it never executed on this module at all. Plateau
# occupancy at vocal against `apical_threshold`:
#
#   threshold   0.25   0.5    1.0    2.0    4.0    8.0
#   occupancy   51.6%  29.1%  6.6%   0.0%   0.0%   0.0%
#
# Half-saturated to silent across a factor of eight in one parameter. Above 2.0
# the compartment never fires and every score it produces reads exactly chance,
# which is the mechanism's own negative control and it passes.
#
# What the tuft holds, `vision->vocal` apical at threshold 1.0:
#
#   read from            object   shuffled
#   vocal's plateaus     0.835    0.502
#   vocal's spikes       0.524    0.502
#
# The object reaches the larynx's dendrites nearly intact and is destroyed at
# the soma. The control is `auditory->vocal` routed to the tuft instead — the
# ears hear nothing in this condition, so that tract carries no object — and
# its plateau column reads **0.529**. The tuft reports what its input carries;
# plateaus are not merely an easier thing to classify than spikes.
#
# The gain transfers part of it into the spikes, 3 of 3 seeds, `calibrate` PASS
# and duty 0.50-0.52 throughout: 0.524 -> **0.711** at apical_gain = 3.0.
#
# And that is still worse than what the project already had. Every arm at 600k
# on the same three seeds, scored by `m3probe` on all of them:
#
#   arm                                    object   word
#   v24: vision->vocal somatic + pooling    0.820    0.968   <- best, unchanged
#   vision->vocal apical, gain 0            0.524      -
#   vision->vocal apical, gain 3.0          0.711      -
#   auditory->vocal (arcuate) to the tuft   0.813    0.552   <- destroys the word
#   central->vocal to the tuft, gain 0      0.818    0.972
#   central->vocal to the tuft, gain 3.0    0.818    0.979
#
# Three things worth keeping. The arcuate arm first read 0.871 and looked like
# a win — it was scored by `apicalprobe` against an `m3probe` baseline, and
# re-run on one instrument it is 0.813 against 0.820, nothing, while the word
# collapses to chance. **Moving `central->vocal` to another compartment and
# switching on a 4x gain changes no number at all**, a third independent
# confirmation that this tract carries nothing. And segregation (0.835 at the
# tuft) and v24's pooling interneurons (0.820 at the soma) reach the same
# ceiling by unrelated means, which puts the remaining loss in the tract rather
# than in how the target integrates it.
apical_tau_ms = 30.0
apical_threshold = 0.0
apical_gain = 0.0
apical_plateau_ms = 50.0

# --- DNA v26: subthreshold oscillations --------------------------------------
# A theta rhythm and a gamma rhythm nested inside it, added to every neuron in
# this module as a current. Both amplitudes 0 is off, and off is bit-identical
# to v25.
#
# Aimed at a measured failure rather than at the fact that cortex oscillates.
# `eligprobe` shows the eligibility trace on central->vocal is large but
# object-BLIND, correlating +0.93 between the two conditions, and the reason is
# structural: pair-based STDP adds `+a_plus * trace_pre` and subtracts
# `-a_minus * trace_post`, both scaling with the same firing rates, so it is
# nearly rate-balanced by construction — while central codes the object as a
# rate difference. It is a timing rule being asked to read a rate code.
#
# On a shared rising ramp a neuron with more drive crosses threshold earlier in
# the cycle than one with less. The rate difference becomes a *timing*
# difference, which is the one thing STDP can see. So the prediction is not
# about accuracy anywhere — it is that the trace on central->vocal becomes
# object-conditional, tested by the probe that found it blind.
#
# Additive, not multiplicative, and the argument above is why: a gain scales
# each neuron's own drive and cannot reorder threshold crossings, while a shared
# ramp makes crossing time a function of drive.
theta_hz = 6.0
theta_amp = 0.0
gamma_hz = 40.0
gamma_amp = 0.0
gamma_theta_coupling = 1.0
#
# MEASURED HERE 2026-08-17: the envelope reaches the weights, and that is all
# that has been established. At `critical_floor` 0.0 with tau 1 s — everything
# closed almost immediately — `dwprobe`'s mean |dw| per synapse on
# central->vocal falls from 3.185e-02 to 4.6e-03. The mechanism works.
#
# At a realistic tau (30 s, floor 0.2) the same probe reads 3.171e-02 against
# 3.185e-02, i.e. nothing, and that is a limit of the instrument rather than a
# result: dwprobe's measurement window sits early in the creature's life, so a
# 30 s time constant has barely begun to close within it. **Whether closing the
# period helps or hurts this creature is NOT measured** — it needs a protocol
# that teaches early and tests late, which nothing here currently does. Ships
# off.
critical_tau_ms = 0.0       # DNA v28: 0 = plasticity never closes (pre-v28)
critical_floor = 0.2        # what the learning rate settles to when it does

# --- DNA v29: plateau-gated plasticity ---------------------------------------
#
# MEASURED AND REFUTED, 2026-08-17. This was the one idea that attacked the
# conditioning blocker head-on rather than routing around it, and the
# best-motivated mechanism in the whole realism run: R-STDP's third factor is a
# global scalar and so can scale a tract but never steer it, while a plateau is
# per-neuron and input-specific — and DNA v25 measured vocal's plateaus
# discriminating cube from ball at 0.835 where the same neurons' spikes managed
# 0.524. Gating eligibility on the plateau should have made the rule conditional
# by construction.
#
# The arm: a `vision->vocal` tract onto the tuft — the configuration the 0.835
# was measured in — with apical_gain 0 so it drives nothing and exists only to
# decide plasticity, and plateau_gate 1.0. Every threshold scored against **the
# same wiring with the gate off**, because adding a tract changes the creature
# by itself. eligprobe at 600k, five creatures:
#
#   threshold  gate passes  cen->vocal  arcuate control  corr(A,B)
#   gate off   -            0.680       0.912            +0.959
#   0.25       76.0%        0.600       0.788            +0.945
#   0.50       50.6%        0.592       0.732            +0.927
#   1.00       15.9%        0.514       0.560   <- UNREADABLE, control at chance
#
# **The gate attenuates; it does not select.** Signal and positive control fall
# together at every operating point, their ratio barely moves (0.746 -> 0.761 ->
# 0.809), and the trace stays nearly identical between the two objects the whole
# way down (+0.959 -> +0.927). The last row is not "the gate destroyed the
# trace" — it is the probe going blind, which eligprobe's own positive control
# caught and printed rather than leaving to be noticed.
#
# The mechanism of the failure is the operating-point trap, for the third time
# in this project (see the visual cortex above, and the pooling interneurons).
# At 76% occupancy nearly every neuron is plateauing nearly all the time, so the
# gate is almost always open and drops a quarter of the learning events at
# moments mostly unrelated to the object. At 16% it is genuinely selective and
# drops five sixths of them, and what survives is shot noise. **There is no
# window in which the gate is both selective and leaves enough events to learn
# from**, and the two ends of the sweep fail for opposite reasons.
#
# The deeper reading is the one v24 and v25 already gave. The *population* of
# plateaus discriminates the object at 0.86, but an individual neuron's plateau
# is a small object-dependent modulation on a large object-independent
# occupancy. Multiplying an object-blind trace by that is common-mode swamping
# again, in a third mechanism. The object signal in this creature keeps turning
# out to be a small differential riding on a big shared term, and every
# mechanism that combines the two — additively, multiplicatively, or as a gate —
# inherits the problem instead of fixing it. What has ever worked here is
# *subtracting* the shared term (v24's in-degree-weighted pooling, +0.077).
#
# Ships off. Off is bit-identical (be2e508dfc170240).
plateau_gate = 0.0          # DNA v29: 0 = eligibility ignores the tuft (pre-v29)
# DNA v32. Lateral competition, so a population centroid has somewhere to sit.
# 0 is off and is bit-identical to not having it. See the note in dna.h: the
# vocal centroid already reaches F1 300-910 Hz, it just never dwells anywhere.
lateral_gain = 0.0          # strength of local excitation minus the field mean
lateral_sigma = 0.10        # excitation width, as a fraction of one field
lateral_fields = 9          # one competitive field per motor group
burst_ms = 0.0               # DNA v37: ISI that counts as a burst. 0 = no burst code
burst_refrac_scale = 1.0     # what an apical plateau does to it. 1.0 = nothing
elig_tau_scale = 1.0         # DNA v39: this module's tau_elig, as a multiple of the global one
# Swept 2026-08-18 on babble/G2. Delivered F1 sd is what the vocal tract
# actually hands the synthesiser; the bar for "postures rather than noise" is a
# bimodality coefficient over 0.556 (a normal distribution reads 0.333).
#
#   gain    duty   delivered F1 sd     bimodal   G2
#   0 (off) 0.51   0.027  (20 Hz)      0.308     PASS 7/9, rate +0.777x
#   0.020   0.53   0.134  (101 Hz)     0.466     PASS 6/9, rate +0.507x
#   0.030   0.69   0.208  (156 Hz)     0.546     not run
#   0.035   0.78   0.255  (192 Hz)     0.614     FAIL 4/9
#   0.045   0.92   0.266             0.613     babble FAILS: the creature drones
#
# READ THE TABLE ABOVE WITH THIS. Every G2 entry in it is ONE point, and the
# surface is not smooth. Holding gain at 0.035 and moving only rate_norm_hz —
# a constant that does nothing to the shipped creature — walks G2 from +0.214
# at 9, to +0.025 at 10, -0.132 at 11, -0.479 at 12, and back to +0.078 at 13.
# A dip, not a threshold: sign reversed twice over 20% of one scaling constant,
# while the same range leaves the shipped creature flat at +0.776/+0.777/
# +0.969/+0.748. So "G2 breaks by 0.035" is NOT safe — 0.035 reads 4 of 9 at
# rate_norm 10 and 6 of 9 at 9 or 13.
#
# What v32 really costs is not a milestone, it is robustness: it trades a
# pinned-but-indifferent vocal code for a mobile-but-fragile one, and a
# mechanism that unstable cannot be tuned by point measurements at all.
# Anything that sets lateral_gain in future has to be scored over a
# NEIGHBOURHOOD of nearby parameter values, not at one.
#
# TWO ATTEMPTS AT A STABLE VERSION, both refuted, and together they say what
# the prerequisite actually is.
#
#   Uniform subtractive competition (lateral_sigma = 0, still selectable).
#   Purely negative feedback, so it cannot run away — and it silences the
#   creature: vocal 4.36 -> 1.44 Hz and duty 0.00 at gain 0.02. Lowering the
#   threshold barely helps (1.44 -> 1.80 Hz across a 20% cut) because the term
#   IS a rate controller: busier field, more subtraction. A uniform term can
#   only sharpen by suppressing, and the two are inseparable.
#
#   Input-driven competition. Same local-minus-mean shape but read off a
#   smoothed synaptic drive instead of firing rate, so there is no self-loop
#   and reward — which changes afferent weights — has something to push. It is
#   stable, and it produces NO place structure at all: raw F1 sd 0.110 against
#   0.115 with the mechanism off, bimodality 0.35 against a Gaussian's 0.333.
#   Removed rather than left in the tree.
#
# The reason is the one this file's own note on the population code gives: the
# projection into the module is random, so nothing makes a neuron's index mean
# anything to its afferents. Input-driven competition can only amplify
# structure the input already has, and the input has none. Rate-driven
# competition manufactures structure out of its own dynamics, which is why it
# widens the vowel space AND why that structure is noise-locked and fragile.
#
# So the prerequisite is topography in the projection INTO vocal, which is what
# the population-code note asked for in the first place. This session tried to
# get it for free from recurrence; it cannot be had that way.
# Shipped OFF at 0.0. The acoustic result that might have justified 0.020 did
# NOT replicate: three fresh seed families, both arms on identical seeds, put
# cube-vs-ball at d' 0.93/1.35/1.15 against nulls of 0.96/1.07/0.99 — straddling
# zero — and acoustic accuracy was LOWER with the mechanism on in 3 of 3. One
# arm failed m3's own shuffled-label control at 0.688. The single run that
# motivated the test was excluded from it, and was noise.
#
# At 0.020 the mechanism is a real gain on everything except G2's rate half:
# the vowel spread is 4.9x, praise's effect on F1 is +0.0559 against the
# shipped +0.0255, and calibrate passes untouched. What it costs is the
# rewarded-rate advantage, +0.507x against +0.777x, and 6 of 9 creatures
# against 7 of 9.
#
# What the replicate showed about WHY it buys no audibility is the useful part:
# the mechanism widens the gap between the two words and scatters each of them
# by the same factor, so the raw distance doubles and d' — which divides by the
# scatter — does not move at all. A wider vowel space is not a more legible one
# while nothing controls where in it each word sits. That is the conditioning
# blocker again, arriving from a new direction.
#
# Note also that v32 makes the 800 ms articulator inertia stop mattering: its
# attenuation of F1 falls from 4.2x to 1.6x, because a bump persists and an EMA
# passes what persists. That is the reason the smoothing_ms sweep was measured
# and deliberately not shipped.



[[module]]
name = "expression"
role = "expression"
neurons = 64
n_max = 512
# 32 was enough until the vision projection widened. Every synapse that lands
# draws its own delay jitter, so changing one projection's density shifts the
# RNG stream for every projection wired after it — and four of expression's
# neurons ended up with more incoming than the reverse index could hold. A
# dropped reverse entry is the worst kind: that synapse still depresses but can
# never potentiate again.
max_out_degree = 48
extent = [1.0, 1.0, 1.0]
conn_radius = 0.45
conn_density = 0.5
# DNA v42 — a synfire chain, laid down at birth. The wiring above is
# distance-based and therefore symmetric, and seqprobe measured that a symmetric
# loop cannot carry a kick forward for even 10 ms (r 0.92 -> 0.03, at every
# weight to 8x). A sequence needs asymmetry AND convergence: a whole group of
# neurons drives the next group, so each cell of the next link gets tens of
# coincident inputs. A per-neuron window gives about three and does nothing. Nothing wraps — a finite chain is a syllable, a wrapping one
# is a loop that sustains forever or seizes. SHIPS OFF at chain_weight = 0,
# which skips the pass and is bit-identical.
chain_weight = 0.0          # 0 disables the whole pass
chain_density = 0.4         # connection probability inside the window
chain_group = 64            # neurons per link; the chain is group k -> group k+1
chain_delay_ms = 3.0        # one link's delay, and so the step of the chain
threshold = 1.0
v_rest = 0.0
leak_tau_ms = 20.0
refractory_ms = 3.0
# Re-measured after the vision projection widened. It was 5.0 against a
# free-running 6.95, which was already drift the genome was paying for; a
# hotter central module made it 8.04, and re-measuring with `calibrate` in
# DNA v5 put it at 8.64. Expression drives nothing but the avatar, so unlike
# vocal it has no behavioural reason to sit below its own rate.
#
# Unchanged by vision->vocal at weight 0.30, but it does NOT stay put at 0.80:
# central projects here, so re-measuring central's target displaces this one and
# `vision` too, and that recalibration needs a second pass. central has
# norm_gain 1.0, which makes its target a fixed point rather than a measurement
# (rule 8). A gentler tract disturbs two targets instead of four.
#
# 7.47 -> 7.22 with the inhibitory auditory->vocal tract, which quiets the
# larynx and so quiets everything the larynx drives.
target_rate_hz = 7.22
inhib_fraction = 0.15
inhib_gain = 2.5
weight_init = 0.12
noise_amp = 0.28
# Relaxed while awake and repaid during sleep — see the [homeostasis] note.
# This is where G2's reward effect was being erased mid-session.
ip_wake_scale = 0.25
ip_sleep_scale = 4.0
syn_wake_scale = 0.25
syn_sleep_scale = 4.0
explore_scale = 0.0        # not a motor module; keeps its plain noise_amp
norm_gain = 0.0            # divisive normalisation off; see [normalisation]
eta_scale = 1.0            # cortical rate; see ModuleRole::kHippocampus
# DNA v20 neuromodulator channel gains; read only when [neuromod] enabled.
nm_external = 1.0
nm_hunger = 1.0
nm_comfort = 1.0
nm_curiosity = 1.0
# DNA v21 pooling interneurons: subtract the gain below times the population
# mean rate of the named source module from every neuron here. -1 disables.
ffi_source = -1
ffi_gain = 0.0
rebound_source = -1          # DNA v44: post-stimulus rebound; -1 disables
rebound_gain = 0.0           # drive += gain * max(0, mean_rate[src] - pool_fast[src])
rebound_mean_tau_ms = 0.0    # DNA v45: subtract the term's own slow mean; 0 = v44
ffi_apical = 0               # DNA v40: land the interneuron on the tuft, not the soma
ffi_learn = 0.0              # DNA v40: and let its weight learn to cancel what arrives there

# --- DNA v25: the apical compartment -----------------------------------------
# A neuron here used to be a point: every synapse summed into one membrane. A
# pyramidal cell is at least two integration sites, and a tract says which one
# it lands on (see `apical` on the projections below).
#
# The tuft integrates on its own slow constant and cannot make the soma fire.
# What it can do is cross `apical_threshold` and start a calcium plateau, and
# for `apical_plateau_ms` after that the soma's synaptic drive is multiplied by
# (1 + apical_gain). Feedforward alone: regular spiking. Feedback alone:
# nothing at all. Both together: a burst.
#
# apical_threshold = 0 disables the compartment on this module, which is what
# every module ships with, and a genome with no apical tract anywhere is
# bit-identical under a v25 core.
apical_tau_ms = 30.0
apical_threshold = 0.0
apical_gain = 0.0
apical_plateau_ms = 50.0

# --- DNA v26: subthreshold oscillations --------------------------------------
# A theta rhythm and a gamma rhythm nested inside it, added to every neuron in
# this module as a current. Both amplitudes 0 is off, and off is bit-identical
# to v25.
#
# Aimed at a measured failure rather than at the fact that cortex oscillates.
# `eligprobe` shows the eligibility trace on central->vocal is large but
# object-BLIND, correlating +0.93 between the two conditions, and the reason is
# structural: pair-based STDP adds `+a_plus * trace_pre` and subtracts
# `-a_minus * trace_post`, both scaling with the same firing rates, so it is
# nearly rate-balanced by construction — while central codes the object as a
# rate difference. It is a timing rule being asked to read a rate code.
#
# On a shared rising ramp a neuron with more drive crosses threshold earlier in
# the cycle than one with less. The rate difference becomes a *timing*
# difference, which is the one thing STDP can see. So the prediction is not
# about accuracy anywhere — it is that the trace on central->vocal becomes
# object-conditional, tested by the probe that found it blind.
#
# Additive, not multiplicative, and the argument above is why: a gain scales
# each neuron's own drive and cannot reorder threshold crossings, while a shared
# ramp makes crossing time a function of drive.
theta_hz = 6.0
theta_amp = 0.0
gamma_hz = 40.0
gamma_amp = 0.0
gamma_theta_coupling = 1.0
critical_tau_ms = 0.0       # DNA v28: 0 = plasticity never closes (pre-v28)
critical_floor = 0.2        # what the learning rate settles to when it does
plateau_gate = 0.0          # DNA v29: 0 = eligibility ignores the tuft (pre-v29)
# DNA v32. Lateral competition, so a population centroid has somewhere to sit.
# 0 is off and is bit-identical to not having it. See the note in dna.h: the
# vocal centroid already reaches F1 300-910 Hz, it just never dwells anywhere.
lateral_gain = 0.0          # strength of local excitation minus the field mean
lateral_sigma = 0.15        # excitation width, as a fraction of one field
lateral_fields = 1          # competitive fields; the vocal module wants 9
burst_ms = 0.0               # DNA v37: ISI that counts as a burst. 0 = no burst code
burst_refrac_scale = 1.0     # what an apical plateau does to it. 1.0 = nothing
elig_tau_scale = 1.0         # DNA v39: this module's tau_elig, as a multiple of the global one



# --- Projections -----------------------------------------------------------
# Sparse by design. The central module has no sensor of its own; it only ever
# sees what the sensory modules have already chewed on.

[[projection]]
src = "auditory"
dst = "central"
kind = "random"
source = "either"        # DNA v14: recruit both cell types, the pre-v14 rule
# MEASURED 2026-08-14 and left alone pending its own verified change: at this
# density the sound does not reach the association module. `pcprobe`'s offline
# ridge ceiling — the best any linear readout of a module's firing rates could
# do, held out — reads the spectrum in B2 at 0.583 and in central at +0.013.
# It is legible at the ear and gone one step later. At 0.06 central reads 0.194
# and at 0.10 it reads 0.266, so the tract is the whole loss, not the ear.
#
# Note what sits ten lines below: vision->central was raised from this same 0.02
# to 0.06 for exactly this reason, and audio was never revisited. G3 is
# cross-modal, and its cascade scores cube-versus-ball — a question the creature
# can answer from vision alone — so no G3 measurement ever taken here has tested
# whether the *word* arrives.
#
# Raising it needs auditory's max_out_degree above 72 (134 synapses drop at
# 0.10) and a recalibration pass; central has norm_gain > 0, which makes that
# the fixed-point loop described in tools/README.md.
density = 0.02
weight = 0.12
delay_ms = 4.0
delay_jitter_ms = 1.0
hebb = 0.0                # DNA v23: per-pathway Hebbian rate, 0 = reward-gated only
apical = 0                # DNA v25: 1 terminates on the target's apical tuft
exuberance = 1.0          # DNA v28: born at density x this, pruned back by experience
birth_weight = 1.0        # DNA v30: born at weight x this; set to 1/exuberance
stp_use = 0.0             # DNA v36: dynamic synapse. 0 = constant weight, the pre-v36 tract
stp_recover_ms = 0.0      # tau_rec: how fast released resources come back
stp_facil_ms = 0.0        # tau_facil: how long raised utilisation lasts. 0 = pure depression
burst_learn = 0.0         # DNA v37: learn from the target's burst deviation, not from reward


[[projection]]
src = "vision"
dst = "central"
kind = "random"
source = "either"        # DNA v14: recruit both cell types, the pre-v14 rule
# Three times the auditory density, and it had to be: at 0.02 an object was
# legible in B3 but only barely in B1, which is precisely the trip M2 is about.
#
# This was 0.04 for M2, chosen by a sweep that scored *object present versus
# absent*. M3 asks a different question of the same wire — which of two shapes
# — and it gets a different answer. Scored on shape, B1 reads 0.52 at 0.02,
# 0.73 at 0.04, 0.80 at 0.06 and 0.85 at 0.10. "Denser is worse" was true of
# the quantity M2 measured (past ~0.06 the association module reads *busier*
# rather than *different*, and present-versus-absent is exactly a busyness
# question) and false of this one. 0.06 is where both are still healthy.
#
# DNA v7 and v8 replaced this tract with retina -> V1 -> V2 -> central, built
# out of the two structured wiring rules the genome still carries. Both stages
# provably computed what they were designed to compute — `v1probe` scores V1's
# orientation map at 24 deg against a 43.6 deg shuffle — and cube-versus-ball
# at central went 0.77 -> 0.473 -> 0.433 anyway, with a four-fold wider readout
# ruling out undersampling as the cause. The wiring is reverted here and the
# mechanism is kept: `kGabor`, `kCurvature`, the two cortical roles and
# `v1probe` all still exist, and a genome that wants them only has to say so.
# See the DNA v7/v8 section of the README before building a third stage.
# Retested after DNA v12, because normalisation divides out exactly the busyness
# that set this cap — 0.06/0.12/0.20 crossed with central's norm_gain, one seed
# family. The cap survives: with normalisation on, mean |d'| at central reads
# 0.202 / 0.212 / 0.202, which is flat, and M2 falls monotonically 96 / 84 / 71%
# (61% with normalisation off). Density buys nothing.
#
# What that sweep did show is worth more than the null. Without normalisation
# mean |d'| *degrades* as this tract thickens, 0.177 -> 0.171 -> 0.124; with it,
# flat. So what normalisation contributes grows with how hard central is driven:
# +0.025, +0.041, +0.078. It is insurance against a loud input, not a way to
# afford a louder one.
#
# Raising this above ~0.15 also needs central's max_out_degree raised: the
