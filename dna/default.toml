# --- Top-down feedback (DNA v14) ---------------------------------------------
#
# Until v14 this creature's projection graph was entirely feedforward apart from
# one weak vocal->central return. Cortex sends about as many fibres back down a
# hierarchy as up it, so that was a large architectural gap rather than a tuning
# choice.
#
# The two tracts below recruit only *inhibitory* central neurons, and that is
# the whole design. Matched for synapse count and total |w|, the excitatory
# version is unstable: it is a positive feedback loop with a gain above one, and
# chasing its operating point diverges rather than converges — five rounds of
# re-measuring took central 8.48 -> 17.48 Hz and vision 4.60 -> 15.90 and it was
# still climbing. The inhibitory version settles in two rounds. That is the
# textbook argument for why cortical feedback is not net-excitatory, arrived at
# by measurement here.
#
# What it buys, three seed families, against the same genome without it:
#
#   vision mean |d'|   0.357 -> 0.372   (+0.015, +0.009, +0.021 — up in 3 of 3)
#   M2                 96%   -> 98%     (+3, +0, +1 — never negative)
#   central            0.658 -> 0.649   (-0.006, +0.014, -0.034 — no effect)
#   G3 ceiling         0.527 -> 0.522   (unmoved)
#
# So it sharpens the module it lands on and the vision->central bottleneck
# throws the gain away, exactly as everything else aimed at that bottleneck has.
# It is shipped for the sensory improvement and the architecture, not for G3.
#
# The cost is that the distance senses free-run at about half their old rate,
# which is why their target_rate_hz above came down. That is not a regression:
# reduced sensory firing under feedback is what "explaining away" means, and it
# is the signature predictive coding predicts. G2 still passes and its effect is
# larger (x1.86 against x1.35), though on fewer creatures (7 of 9 against 9).

# vision -> vocal. Added 2026-08-18, and it ships for G2, NOT for G3.
#
# Why it exists. `projprobe` pushes a module's own activity through a random
# sparse binary matrix -- the linear part of a tract, no threshold, nothing
# else driving the target -- and asks what survives:
#
#   arm                    at source   d=0.03   d=0.15   d=0.40   shuffled
#   object from central    0.760       0.620    0.560    0.600    0.460
#   object from vision     0.960       0.980    0.840    0.640    0.540
#   word from auditory     1.000       1.000    1.000    0.660    0.400
#
# Vision's object code crosses a sparse tract intact; central's does not. The
# genome had nine projections and vision reached only `central`, so the one
# source whose code survives a tract had no route to the larynx. This is that
# route, and it is the first thing in this project to put the seen object at
# the larynx: m3probe's vocal row goes 0.500 -> 0.760, g3probe's "does it
# ARRIVE" row 0.515 -> 0.654.
#
# Why density 0.03. Matching central->vocal exactly (d=0.03, w=0.14) delivered
# NOTHING -- vocal 0.600 interleaved against a 0.500 baseline, +8% drive. The
# linear model above has nothing else driving the target; the real vocal fires
# ~971 spikes/trial on its own, so a tract that does not compete with that is
# invisible. Density is the wrong axis; weight is. Sweeping weight at d=0.03
# (uncalibrated creatures, arcuate at its shipped 0.12):
#
#   weight   0.14    0.40    0.80    1.20    1.60    2.40
#   vocal    0.600   0.760   0.880   0.880   0.860   0.900
#
# Monotone to 0.80 then a plateau, shuffled control flat at 0.520 throughout.
# Denser arms are worse at the same drive (d=0.15/w=0.14 puts the voice at
# 0.580) -- sparse AND strong, because pooling is what destroys this code and
# drive is what makes it reach the target at all.
#
# WHY 0.30 AND NOT 0.80, which is the part that cost a rebuild. The delivery
# knee is 0.80, and at 0.80 the creature FAILS the `audio` experiment. The
# larynx is loud enough that the ear hears it -- `self_gain` mixes the
# creature's own voice into the room -- so mel energy during "silence" goes
# 0.0499 -> 0.0830 and an external vowel no longer lifts the auditory module
# by the 10% that experiment requires. The baby babbles over you. Recalibrated
# arms, ratio is vowel rate over silence rate and must exceed 1.10:
#
#   weight   0.20    0.30    0.45     (pre-change genome: 1.36)
#   audio    1.22    1.15    1.07 FAIL
#   vocal    0.600   0.760   0.800
#
# 0.30 is the largest weight that leaves the creature able to hear. It gives up
# nothing measurable in delivery: 0.760, the same as w=0.80 once the arcuate is
# left alone (see the note there -- raising the arcuate to compensate for a
# strong tract was solving the wrong half, and made `audio` worse). A gentler
# tract also disturbs two calibration targets instead of four.
#
# The control that makes the delivery believable: the central->vocal density
# sweep drove vocal to 1686 spikes/trial and scored 0.500, while this tract at
# 1400 scores 0.880. Drive is not information. The source is what changed.
#
# What it buys -- G2, on the same nine seeds, a paired comparison:
#
#                     before     after
#   praise won        7 of 9     9 of 9
#   F1 advantage      +0.0255    +0.0556
#   rewarded rate     +0.777x    +0.707x   <- the one thing that got worse
#
# The F1 advantage is the largest ever recorded here, above DNA v32's +0.0559
# without v32's rate_norm fragility. The rewarded-rate advantage slips slightly
# and that is an honest cost, not a rounding error; G2's criterion is the
# within-session rise (x1.61) and the win count, and both improved.
#
# What it does NOT buy, measured and settled. G3 does not move. On this exact
# genome, with g3probe's echo control PASSING at 0.750, the object arrives at
# vocal at 0.654 against 0.515 before -- and taught minus random is -0.014,
# with 0 of 5 creatures over the 0.75 bar. Delivery up 27% and the milestone
# went nowhere. Third independent confirmation that delivery was never G3's
# limit; the blocker is conditioning, and no tract fixes it. Do NOT add another
# delivery mechanism for G3.
#
# A trap worth recording: a 300k --allow-short screen of an earlier arm read
# teacher 0.618 / random 0.536, a +0.082 gap. The 900k run reversed it to
# 0.518 / 0.563. Screens select candidates and never conclude.
#
# It is added LAST on purpose, the same reason the arcuate is: every landed
# synapse draws its own delay jitter, so a projection inserted earlier rewires
# every projection after it.
