# NOT a bottleneck. LESIONED AND RECALIBRATED 2026-08-16: set this weight to 0,
# raise vocal's noise_amp 0.22 -> 0.26 to replace the drive, one calibrate pass
# on central's target_rate_hz (7.20 -> 6.93), and the creature comes back to its
# operating point — 938.6 vocal spikes/trial against 944.9, duty 0.54 against
# 0.51, calibrate PASS. Then every G3 number is unchanged:
