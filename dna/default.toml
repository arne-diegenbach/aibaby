# which lands ~31 more synapses on every inhibitory auditory cell and overran
# this cap on EIGHT of the nine seeds — up to 21 dropped per creature, and
# invisible on the default seed. That is rule 6 earning its keep. Raising a cap
# draws no random numbers, so it was verified inert on its own first.
max_out_degree = 256
extent = [1.0, 1.0, 1.0]
conn_radius = 0.4
conn_density = 0.5
# DNA v42 — a synfire chain, laid down at birth. The wiring above is
# distance-based and therefore symmetric, and seqprobe measured that a symmetric
# loop cannot carry a kick forward for even 10 ms (r 0.92 -> 0.03, at every
# weight to 8x). A sequence needs asymmetry AND convergence: a whole group of
# neurons drives the next group, so each cell of the next link gets tens of
# coincident inputs. A per-neuron window gives about three and does nothing. Nothing wraps — a finite chain is a syllable, a wrapping one
# is a loop that sustains forever or seizes. SHIPS OFF at chain_weight = 0,
# which skips the pass and is bit-identical.
chain_weight = 0.0          # 0 disables the whole pass
chain_density = 0.4         # connection probability inside the window
chain_group = 64            # neurons per link; the chain is group k -> group k+1
chain_delay_ms = 3.0        # one link's delay, and so the step of the chain
threshold = 1.0
v_rest = 0.0
leak_tau_ms = 20.0
refractory_ms = 3.0
target_rate_hz = 2.55        # lowered by top-down feedback: an inhibited
                             # sensory module free-runs slower, which is what
