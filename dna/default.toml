# The control is the row that makes the rest readable: at d=0.15, the real
# `auditory->vocal` density, the word projects at 1.000 and the creature really
# does read the word in vocal at 0.960.
#
# Two things follow. The object code is pooling-fragile and the word code is
# not — the word is legible on 32 spatial bins (1.000) while the object is only
# legible per-neuron (0.640 binned in central, 0.690 in vision), because the
# auditory pathway is tonotopic and `vision->central` is `kind = "random"`.
# Summing random subsets keeps a spatially coherent code and cancels a balanced
# one. And a random tract's capacity FALLS with density: the word itself dies at
# d=0.40, because as each target sums more sources every target converges on the
# population mean. **The good direction on this density is down, not up.**
